name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci and setup-node's npm cache both require a committed lockfile.
      # Until `npm install` has been run locally and package-lock.json is
      # committed, fall back to install.
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - run: npm run typecheck

      - run: npm test

      # A broken production build must not merge. Placeholder Supabase values
      # are enough: nothing here reaches the network at build time.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          CRON_SECRET: placeholder-cron-secret
