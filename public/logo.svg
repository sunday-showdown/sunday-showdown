<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sunday Showdown">
  <defs>
    <linearGradient id="ss-red" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FF3A36" />
      <stop offset="50%" stop-color="#F01219" />
      <stop offset="100%" stop-color="#B80C12" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#ss-red)" stroke-width="46" stroke-linecap="butt">
    <!-- Upper arm of the S: enters from the right, sweeps left over the ball. -->
    <path d="M482 150 H250 C166 150 112 196 86 258" />
    <!-- Lower arm: the 180° mirror, closing the S. -->
    <path d="M30 362 H262 C346 362 400 316 426 254" />
  </g>

  <!-- The ball: a bold lens, drawn as a stroke so the counter stays open. -->
  <path fill="none" stroke="url(#ss-red)" stroke-width="30" stroke-linejoin="round"
        d="M256 182 C332 182 398 214 440 256 C398 298 332 330 256 330
           C180 330 114 298 72 256 C114 214 180 182 256 182 Z" />

  <!-- Laces. -->
  <g fill="url(#ss-red)">
    <rect x="198" y="250" width="116" height="12" rx="6" />
    <rect x="214" y="228" width="12" height="56" rx="6" />
    <rect x="244" y="222" width="12" height="68" rx="6" />
    <rect x="274" y="228" width="12" height="56" rx="6" />
  </g>
</svg>
